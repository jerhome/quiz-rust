[workspace]
resolver = "2"
members = ["crates/quiz-core", "crates/quiz-llm", "crates/quiz-net", "crates/quiz-app"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

# Dependencies rarely need stepping through; optimizing them keeps the debug app responsive.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
lto = "thin"
