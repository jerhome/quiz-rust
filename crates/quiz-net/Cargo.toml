[package]
name = "quiz-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
quiz-core = { path = "../quiz-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15.0"
getrandom = "0.4"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "http1", "service"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
